<body><div class="app">
<header><div><h1>营养Pro</h1><div class="date" id="today"></div><div id="syncStatus" class="status">☁︎ 本地模式</div></div><div class="headBtns"><button type="button" class="iconbtn" id="account" title="账号与云同步">☁︎</button><button type="button" class="iconbtn" id="settings">⚙︎</button></div></header>

<section class="card hero"><div class="ring" id="ring"><div class="ringtxt"><b id="kcal">0</b><span>kcal / 今日</span></div></div><div class="stats">
<div class="stat"><span>蛋白质</span><div class="bar"><div class="fill" id="pb"></div></div><span class="num" id="pn">0g</span></div>
<div class="stat"><span>碳水</span><div class="bar"><div class="fill" id="cb"></div></div><span class="num" id="cn">0g</span></div>
<div class="stat"><span>脂肪</span><div class="bar"><div class="fill" id="fb"></div></div><span class="num" id="fn">0g</span></div>
<div class="small muted" id="remain"></div></div></section>

<section class="card"><h2>添加食物</h2><div class="formgrid"><div><label>餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></div><div><label>重量（g）</label><input id="grams" type="number" value="100" min="1" inputmode="decimal"></div></div>
<label>食物</label><div class="grid"><button type="button" class="btn secondary" id="pick" style="width:100%;text-align:left">选择食物：燕麦片</button><button type="button" class="btn secondary" id="customBtn" style="width:100%">＋ 自定义</button></div>
<div class="small muted" id="preview" style="margin:8px 0"></div>
<div id="customBox" style="display:none"><div class="customHint">直接输入这次食物的营养数据即可。这里输入的 kcal / P / C / F 就是本次记录的实际数值。</div><div class="customGrid">
<div><label>卡路里（kcal）</label><input id="customKcal" type="number" min="0" step=".1" inputmode="decimal"></div>
<div><label>蛋白质（g）</label><input id="customP" type="number" min="0" step=".1" inputmode="decimal"></div>
<div><label>碳水（g）</label><input id="customC" type="number" min="0" step=".1" inputmode="decimal"></div>
<div><label>脂肪（g）</label><input id="customF" type="number" min="0" step=".1" inputmode="decimal"></div>
</div></div>
<button type="button" class="btn" id="add" style="width:100%">＋ 添加到今天</button></section>

<section class="card"><h2>今日记录</h2><div id="entries"></div></section>

<section class="card"><h2>近几天变化</h2><div class="tabs"><button type="button" class="tab on" data-m="kcal">热量</button><button type="button" class="tab" data-m="macro">三大营养素</button><button type="button" class="tab" data-m="weight">体重</button><button type="button" class="tab" data-m="water">喝水</button></div><div class="rangeTabs"><button type="button" class="range on" data-range="7">7天</button><button type="button" class="range" data-range="14">14天</button><button type="button" class="range" data-range="30">30天</button></div><div class="chartbox"><canvas id="chart" width="700" height="260"></canvas></div><div id="chartLegend" class="legend"></div><div class="small muted" id="chartNote" style="margin-top:8px"></div></section>

<section class="card"><h2>快捷功能</h2><div class="grid"><button type="button" class="btn secondary" id="water">💧 喝水 250ml</button><button type="button" class="btn secondary" id="weight">⚖︎ 记录体重</button><button type="button" class="btn secondary" id="backup">↥ 备份数据</button><button type="button" class="btn secondary" id="reset">↺ 今日清空</button></div></section>
<div class="source">食物数值为每100g标准参考值；生熟状态、品种、品牌和烹饪方式会造成差异。品牌食品请优先以包装营养标签为准。</div>
</div>

<dialog id="foodDlg"><div class="modal"><h2>选择食物</h2><input id="search" placeholder="搜索食物，例如：鸡胸、燕麦、香蕉"><button type="button" class="btn" id="addCustomFood" style="width:100%;margin-top:10px">＋ 自定义添加食物</button><div class="list" id="foodList"></div><button type="button" class="btn secondary" id="closeFood" style="width:100%;margin-top:12px">关闭</button></div></dialog>
<dialog id="setDlg"><div class="modal"><h2>每日目标</h2><label>热量 kcal</label><input id="gk"><label>蛋白质 g</label><input id="gp"><label>碳水 g</label><input id="gc"><label>脂肪 g</label><input id="gf"><div class="grid" style="margin-top:14px"><button type="button" class="btn" id="saveSet">保存</button><button type="button" class="btn secondary" id="closeSet">关闭</button></div></div></dialog>
<dialog id="customFoodDlg"><div class="modal"><h2>自定义添加食物</h2><div class="customHint">以下营养数据均按<strong>每100g</strong>填写，保存后会进入你的食物库，并可云同步。</div><label>食物名称</label><input id="cfName" placeholder="例如：自制鸡肉卷"><div class="customGrid">
<div><label>卡路里（kcal / 100g）</label><input id="cfKcal" type="number" min="0" step=".1"></div><div><label>蛋白质（g / 100g）</label><input id="cfP" type="number" min="0" step=".1"></div><div><label>碳水（g / 100g）</label><input id="cfC" type="number" min="0" step=".1"></div><div><label>脂肪（g / 100g）</label><input id="cfF" type="number" min="0" step=".1"></div>
</div><div class="grid" style="margin-top:14px"><button type="button" class="btn" id="saveCustomFood">保存食物</button><button type="button" class="btn secondary" id="closeCustomFood">取消</button></div></div></dialog>
<dialog id="weiDlg"><div class="modal"><h2>记录体重</h2><label>体重 kg</label><input id="wi" type="number" step=".1" inputmode="decimal"><div class="grid" style="margin-top:14px"><button type="button" class="btn" id="saveW">保存</button><button type="button" class="btn secondary" id="closeW">关闭</button></div></div></dialog>
<dialog id="authDlg"><div class="modal"><h2>账号与云同步</h2><div id="authBody"></div><button type="button" class="btn secondary" id="closeAuth" style="width:100%;margin-top:12px">关闭</button></div></dialog>
<div class="toast" id="toast"></div>

 $("entries").innerHTML=es.length?es.map((e)=>`<div class="entryCard"><div class="entryHead"><div><b>${esc(e.food)}</b><div class="small muted">${esc(e.meal)} · ${e.grams}g</div></div><button type="button" class="del" data-id="${esc(e.id||"")}" data-index="${S.entries.indexOf(e)}">×</button></div><div class="entryKcal">${Math.round(e.kcal)} kcal</div><div class="entryMacros"><span class="p">蛋白质 ${(+e.p).toFixed(1)}g</span><span class="c">碳水 ${(+e.c).toFixed(1)}g</span><span class="f">脂肪 ${(+e.f).toFixed(1)}g</span></div></div>`).join(""):'<div class="empty">今天还没有记录</div>';
 $("entries").querySelectorAll(".del").forEach(b=>b.onclick=async()=>{let i=+b.dataset.index,e=S.entries[i];if(currentUser&&e.id){let r=await sb.from("food_entries").delete().eq("id",e.id);if(r.error){toast("云端删除失败，未删除");return}}S.entries.splice(i,1);save();render();toast("已删除")});
 draw(currentChart);
}
function foodList(){
 let q=$("search").value.trim().toLowerCase(),all=FOODS.filter(f=>!q||f.name.toLowerCase().includes(q)),out="",groups={};
 all.forEach(f=>(groups[f.cat]??=[]).push(f));
 Object.keys(groups).forEach(cat=>{out+=`<div class="cat">${esc(cat)}</div>`;groups[cat].forEach(f=>out+=`<button type="button" class="fooditem" data-food="${encodeURIComponent(f.name)}"><b>${esc(f.name)}</b><span class="small muted"> · ${f.kcal} kcal · P ${f.p}g · C ${f.c}g · F ${f.f}g /100g</span></button>`)});
 let custom=S.customFoods.filter(f=>!q||f.name.toLowerCase().includes(q));
 if(custom.length){out+='<div class="cat">我的自定义食物</div>';custom.forEach(f=>out+=`<div style="display:flex;background:#fff;border-bottom:1px solid #eee"><button type="button" class="fooditem" data-food="${encodeURIComponent(f.name)}" style="flex:1;border-bottom:0"><b>${esc(f.name)}</b><span class="small muted"> · ${f.kcal} kcal · P ${f.p}g · C ${f.c}g · F ${f.f}g /100g</span></button><button type="button" data-custom="${encodeURIComponent(f.name)}" style="border:0;background:none;color:#999;padding:0 13px">删除</button></div>`) }
 $("foodList").innerHTML=out||'<div class="empty">没有找到</div>';
 $("foodList").querySelectorAll(".fooditem").forEach(b=>b.onclick=()=>{S.selected=decodeURIComponent(b.dataset.food);save();customMode=false;closeDlg($("foodDlg"));render();toast("已选择 "+S.selected)});
 $("foodList").querySelectorAll("[data-custom]").forEach(b=>b.onclick=async()=>{let n=decodeURIComponent(b.dataset.custom);if(!confirm("删除自定义食物「"+n+"」？"))return;if(currentUser){let r=await sb.from("custom_foods").delete().eq("user_id",currentUser.id).eq("name",n);if(r.error){toast("云端删除失败");return}}S.customFoods=S.customFoods.filter(f=>f.name!==n);if(S.selected===n)S.selected=FOODS[0].name;save();foodList();render();toast("已删除")});
}

async function cloudLoad(){
 if(!currentUser)return;
 let uid=currentUser.id;
 let [en,cf,wa,we,go]=await Promise.all([
  sb.from("food_entries").select("*").eq("user_id",uid).order("created_at"),
  sb.from("custom_foods").select("*").eq("user_id",uid).order("name"),
  sb.from("water_entries").select("*").eq("user_id",uid).order("entry_date"),
  sb.from("weight_entries").select("*").eq("user_id",uid).order("entry_date"),
  sb.from("user_goals").select("*").eq("user_id",uid).maybeSingle()
 ]);
 let err=[en,cf,wa,we,go].find(x=>x.error);if(err)throw err.error;
 let hasCloud=en.data.length||cf.data.length||wa.data.length||we.data.length||go.data;
 let hasLocal=S.entries.length||S.customFoods.length||Object.keys(S.water).length||Object.keys(S.weights).length;
 if(!hasCloud&&hasLocal){await cloudPushAll();return}
 if(hasCloud){
  S.entries=en.data.map(e=>({id:e.id,date:e.entry_date,meal:e.meal,food:e.food,grams:e.grams,kcal:e.kcal,p:e.protein,c:e.carbs,f:e.fat}));
  S.customFoods=cf.data.map(f=>({id:f.id,name:f.name,cat:"我的自定义食物",kcal:f.kcal,p:f.protein,c:f.carbs,f:f.fat}));
  S.water={};wa.data.forEach(r=>S.water[r.entry_date]=(S.water[r.entry_date]||0)+(Number(r.amount_ml)||0));
  S.weights={};we.data.forEach(r=>S.weights[r.entry_date]=Number(r.weight));
  if(go.data)S.goals={kcal:go.data.kcal||2200,p:go.data.protein||140,c:go.data.carbs||250,f:go.data.fat||70};
  if(!S.customFoods.some(f=>f.name===S.selected)&&!FOODS.some(f=>f.name===S.selected))S.selected=FOODS[0].name;
  S.cloudPending=false;save();
 }else{await cloudSaveGoals()}
}

async function cloudPushAll(){
 if(!currentUser||syncing)return;
 syncing=true;setStatus("☁︎ 正在同步…");
 try{
  let uid=currentUser.id;
  await sb.from("food_entries").delete().eq("user_id",uid);
  await sb.from("custom_foods").delete().eq("user_id",uid);
  await sb.from("water_entries").delete().eq("user_id",uid);
  await sb.from("weight_entries").delete().eq("user_id",uid);
  for(let e of S.entries){let r=await sb.from("food_entries").insert({user_id:uid,entry_date:e.date,meal:e.meal,food:e.food,grams:e.grams,kcal:e.kcal,protein:e.p,carbs:e.c,fat:e.f}).select().single();if(r.error)throw r.error;e.id=r.data.id}
  for(let f of S.customFoods){let r=await sb.from("custom_foods").insert({user_id:uid,name:f.name,kcal:f.kcal,protein:f.p,carbs:f.c,fat:f.f}).select().single();if(r.error)throw r.error;f.id=r.data.id}
  for(let d in S.water){if(S.water[d]>0){let r=await sb.from("water_entries").insert({user_id:uid,entry_date:d,amount_ml:S.water[d]});if(r.error)throw r.error}}
  for(let d in S.weights){if(S.weights[d]>0){let r=await sb.from("weight_entries").insert({user_id:uid,entry_date:d,weight:S.weights[d]});if(r.error)throw r.error}}
  await cloudSaveGoals();
  S.cloudPending=false;save();setStatus("☁︎ 已同步","ok");render();
 }catch(e){console.error(e);S.cloudPending=true;save();setStatus("☁︎ 同步失败","err");toast("已保存到本机，云同步失败")}
 finally{syncing=false}
}
async function cloudSaveGoals(){
 if(!currentUser)return;
 let r=await sb.from("user_goals").upsert({user_id:currentUser.id,kcal:S.goals.kcal,protein:S.goals.p,carbs:S.goals.c,fat:S.goals.f,water_ml:2000},{onConflict:"user_id"});
 if(r.error)throw r.error;
}
async function cloudAddEntry(e){
 if(!currentUser){return}
 let r=await sb.from("food_entries").insert({user_id:currentUser.id,entry_date:e.date,meal:e.meal,food:e.food,grams:e.grams,kcal:e.kcal,protein:e.p,carbs:e.c,fat:e.f}).select().single();
 if(r.error)throw r.error;e.id=r.data.id;
}
async function cloudSaveCustom(f){
 if(!currentUser)return;
 let old=await sb.from("custom_foods").select("id").eq("user_id",currentUser.id).eq("name",f.name).maybeSingle();
 if(old.error)throw old.error;
 let r=old.data?await sb.from("custom_foods").update({kcal:f.kcal,protein:f.p,carbs:f.c,fat:f.fat}).eq("id",old.data.id).select().single():await sb.from("custom_foods").insert({user_id:currentUser.id,name:f.name,kcal:f.kcal,protein:f.p,carbs:f.c,fat:f.fat}).select().single();
 if(r.error)throw r.error;f.id=r.data.id;
}
async function cloudWater(d,v){
 if(!currentUser)return;
 let a=await sb.from("water_entries").delete().eq("user_id",currentUser.id).eq("entry_date",d);if(a.error)throw a.error;
 let r=await sb.from("water_entries").insert({user_id:currentUser.id,entry_date:d,amount_ml:v});if(r.error)throw r.error;
}
async function cloudWeight(d,v){
 if(!currentUser)return;
 let a=await sb.from("weight_entries").delete().eq("user_id",currentUser.id).eq("entry_date",d);if(a.error)throw a.error;
 let r=await sb.from("weight_entries").insert({user_id:currentUser.id,entry_date:d,weight:v});if(r.error)throw r.error;
}

function authRender(){
 if(currentUser){
  $("authBody").innerHTML=`<div class="authInfo">当前账号<br><strong>${esc(currentUser.email||"")}</strong><br><span class="small muted">数据会自动同步到云端</span></div><button type="button" class="btn" id="syncNow" style="width:100%">☁︎ 立即同步</button><button type="button" class="btn secondary" id="logout" style="width:100%;margin-top:9px">退出登录</button>`;
  $("syncNow").onclick=async()=>{await cloudPushAll();toast("同步完成")};
  $("logout").onclick=async()=>{await sb.auth.signOut();closeDlg($("authDlg"));toast("已退出登录")};
 }else{
  $("authBody").innerHTML=`<div class="authInfo">登录后可以在不同设备之间同步你的饮食、体重、喝水、自定义食物和每日目标。</div><label>邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>密码</label><input id="authPass" type="password" autocomplete="current-password" placeholder="至少6位"><div class="authBtns"><button type="button" class="btn" id="login">登录</button><button type="button" class="btn secondary" id="register">注册</button></div><div class="small muted" style="margin-top:10px">如果注册后没有立即登录，请先检查邮箱验证邮件。</div>`;
  $("login").onclick=authLogin;$("register").onclick=authRegister;
 }
}
async function authLogin(){
 let email=$("authEmail").value.trim(),password=$("authPass").value;
 if(!email||!password){toast("请输入邮箱和密码");return}
 let r=await sb.auth.signInWithPassword({email,password});if(r.error){toast(r.error.message);return}
 closeDlg($("authDlg"));
}
async function authRegister(){
 let email=$("authEmail").value.trim(),password=$("authPass").value;
 if(!email||password.length<6){toast("请输入邮箱，密码至少6位");return}
 let r=await sb.auth.signUp({email,password});if(r.error){toast(r.error.message);return}
 if(r.data.session){toast("注册成功");closeDlg($("authDlg"))}else toast("注册成功，请查收验证邮件");
}
async function initAuth(){
 let r=await sb.auth.getSession();
 if(r.error){setStatus("☁︎ 本地模式","err");return}
 await handleSession(r.data.session);
 sb.auth.onAuthStateChange((event,session)=>setTimeout(()=>handleSession(session),0));
}
async function handleSession(session){
 currentUser=session?.user||null;
 $("account").textContent=currentUser?"☁✓":"☁︎";
 $("account").title=currentUser?"已登录："+(currentUser.email||""):"账号与云同步";
 if(!currentUser){setStatus("☁︎ 本地模式");return}
 setStatus("☁︎ 正在同步…");
 try{
  if(S.cloudPending)await cloudPushAll();else await cloudLoad();
  setStatus("☁︎ 已同步","ok");render();
 }catch(e){console.error(e);setStatus("☁︎ 云同步失败","err");toast("云同步失败，当前数据仍保存在本机")}
}

$("pick").onclick=()=>{customMode=false;render();$("search").value="";foodList();openDlg($("foodDlg"))};
$("customBtn").onclick=()=>{customMode=!customMode;render();if(customMode)$("customKcal").focus()};
$("closeFood").onclick=()=>closeDlg($("foodDlg"));$("search").oninput=foodList;
$("addCustomFood").onclick=()=>{closeDlg($("foodDlg"));["cfName","cfKcal","cfP","cfC","cfF"].forEach(id=>$(id).value="");openDlg($("customFoodDlg"));$("cfName").focus()};
$("closeCustomFood").onclick=()=>closeDlg($("customFoodDlg"));
$("saveCustomFood").onclick=async()=>{
 let n=$("cfName").value.trim(),k=+$("cfKcal").value,p=+$("cfP").value,c=+$("cfC").value,f=+$("cfF").value;
 if(!n||[k,p,c,f].some(v=>!isFinite(v)||v<0)){toast("请完整填写数据");return}
 if(S.customFoods.some(x=>x.name===n)||FOODS.some(x=>x.name===n)){toast("已有同名食物");return}
 let obj={name:n,cat:"我的自定义食物",kcal:k,p,c,f};S.customFoods.push(obj);S.selected=n;save();closeDlg($("customFoodDlg"));render();
 if(currentUser)try{await cloudSaveCustom(obj);save();setStatus("☁︎ 已同步","ok");toast("✓ 已添加并同步")}catch(e){S.cloudPending=true;save();setStatus("☁︎ 待同步","err");toast("已保存本机，稍后同步")}
 else toast("✓ 已添加 "+n);
};
$("grams").oninput=render;["customKcal","customP","customC","customF"].forEach(id=>$(id).oninput=()=>customMode&&render());
$("add").onclick=async()=>{
 let grams=+$("grams").value;if(!isFinite(grams)||grams<=0){toast("请输入有效重量");return}
 let e;
 if(customMode){let k=+$("customKcal").value,p=+$("customP").value,c=+$("customC").value,f=+$("customF").value;if([k,p,c,f].some(v=>!isFinite(v)||v<0)){toast("请把四项数据填写完整");return}e={date:day(),meal:$("meal").value,food:"自定义",grams,kcal:k,p,c,f,custom:true}}
 else{let f=food(),v=calc();e={date:day(),meal:$("meal").value,food:f.name,grams,kcal:v.kcal,p:v.p,c:v.c,f:v.f}}
 S.entries.push(e);save();render();toast("✓ 已添加 "+e.food);
 if(currentUser)try{await cloudAddEntry(e);save();setStatus("☁︎ 已同步","ok")}catch(err){S.cloudPending=true;save();setStatus("☁︎ 待同步","err");toast("本机已保存，云端稍后同步")}
};
$("settings").onclick=()=>{$("gk").value=S.goals.kcal;$("gp").value=S.goals.p;$("gc").value=S.goals.c;$("gf").value=S.goals.f;openDlg($("setDlg"))};
$("closeSet").onclick=()=>closeDlg($("setDlg"));
$("saveSet").onclick=async()=>{S.goals={kcal:+$("gk").value||2200,p:+$("gp").value||140,c:+$("gc").value||250,f:+$("gf").value||70};save();closeDlg($("setDlg"));render();if(currentUser)try{await cloudSaveGoals();setStatus("☁︎ 已同步","ok")}catch(e){S.cloudPending=true;save();toast("目标已保存本机，云同步失败")}else toast("目标已保存")};
$("water").onclick=async()=>{let d=day();S.water[d]=(S.water[d]||0)+250;save();render();toast("今日饮水 "+S.water[d]+" ml");if(currentUser)try{await cloudWater(d,S.water[d]);setStatus("☁︎ 已同步","ok")}catch(e){S.cloudPending=true;save();setStatus("☁︎ 待同步","err")}};
$("weight").onclick=()=>{$("wi").value=S.weights[day()]||"";openDlg($("weiDlg"))};$("closeW").onclick=()=>closeDlg($("weiDlg"));
$("saveW").onclick=async()=>{let v=+$("wi").value;if(v<=0){toast("请输入有效体重");return}let d=day();S.weights[d]=v;save();closeDlg($("weiDlg"));currentChart="weight";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.m==="weight"));render();toast("体重已保存");if(currentUser)try{await cloudWeight(d,v);setStatus("☁︎ 已同步","ok")}catch(e){S.cloudPending=true;save();setStatus("☁︎ 待同步","err")}};
$("backup").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="营养Pro备份-"+day()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("备份已生成")};
$("reset").onclick=async()=>{if(!confirm("确定清空今天所有记录？"))return;if(currentUser){let r=await sb.from("food_entries").delete().eq("user_id",currentUser.id).eq("entry_date",day());if(r.error){toast("云端删除失败，未清空");return}}S.entries=S.entries.filter(e=>e.date!==day());save();render();toast("今日已清空")};
$("account").onclick=()=>{authRender();openDlg($("authDlg"))};$("closeAuth").onclick=()=>closeDlg($("authDlg"));

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{currentChart=b.dataset.m;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.m===currentChart));draw(currentChart)});
document.querySelectorAll(".range").forEach(b=>b.onclick=()=>{chartRange=+b.dataset.range;document.querySelectorAll(".range").forEach(x=>x.classList.toggle("on",x===b));draw(currentChart)});

function draw(mode){
 let c=$("chart"),box=c.parentElement,rect=box.getBoundingClientRect(),W=Math.max(320,Math.floor(rect.width-16)),H=190,dpr=devicePixelRatio||1;
 c.width=W*dpr;c.height=H*dpr;c.style.width="100%";c.style.height=H+"px";let x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 let ds=[];for(let i=chartRange-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);ds.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))}
 let labels=ds.map(d=>d.slice(5).replace("-","/")),series;
 if(mode==="kcal")series=[{name:"热量",data:ds.map(d=>totals(d).kcal),color:"#202225"}];
 else if(mode==="weight")series=[{name:"体重",data:ds.map(d=>S.weights[d]||null),color:"#7a7d82"}];
 else if(mode==="water")series=[{name:"喝水量",data:ds.map(d=>+(S.water[d]||0)),color:"#4f7cff"}];
 else series=[{name:"蛋白质",data:ds.map(d=>totals(d).p),color:"#4f7cff"},{name:"碳水",data:ds.map(d=>totals(d).c),color:"#20a464"},{name:"脂肪",data:ds.map(d=>totals(d).f),color:"#e58a22"}];
 let vals=series.flatMap(s=>s.data.filter(v=>v!=null&&isFinite(v))),max=Math.max(...vals,1),min=0;if(mode==="weight"&&vals.length){min=Math.max(0,Math.floor(Math.min(...vals)-1));max=Math.max(max,Math.ceil(Math.max(...vals)+1))}else max*=1.15;
 let L=38,R=10,T=20,B=30,pw=(W-L-R)/Math.max(1,chartRange-1),ph=H-T-B;x.font="11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif";x.strokeStyle="#dfe1e4";
 for(let i=0;i<=4;i++){let yy=T+ph*i/4;x.beginPath();x.moveTo(L,yy);x.lineTo(W-R,yy);x.stroke();x.fillStyle="#8a8d91";x.fillText(Math.round(max-(max-min)*i/4),4,yy+4)}
 let step=Math.max(1,Math.ceil(chartRange/7));labels.forEach((l,i)=>{if(i%step&&i!==labels.length-1)return;x.fillStyle="#888";x.fillText(l,Math.max(L,i*pw+L-14),H-8)});
 series.forEach(s=>{x.strokeStyle=s.color;x.lineWidth=2.5;x.beginPath();let started=false;s.data.forEach((v,i)=>{if(v==null||!isFinite(v)){started=false;return}let xx=L+i*pw,yy=T+ph-(v-min)/(max-min||1)*ph;if(!started){x.moveTo(xx,yy);started=true}else x.lineTo(xx,yy)});x.stroke();s.data.forEach((v,i)=>{if(v==null||!isFinite(v))return;let xx=L+i*pw,yy=T+ph-(v-min)/(max-min||1)*ph;x.fillStyle=s.color;x.beginPath();x.arc(xx,yy,2.5,0,Math.PI*2);x.fill()})});
 $("chartLegend").innerHTML=mode==="macro"?'<span><i class="legendDot p"></i>蛋白质</span><span><i class="legendDot c"></i>碳水</span><span><i class="legendDot f"></i>脂肪</span>':mode==="kcal"?'<span><i class="legendDot kcal"></i>热量</span>':mode==="water"?'<span><i class="legendDot weight"></i>喝水量</span>':'<span><i class="legendDot weight"></i>体重</span>';
 $("chartNote").textContent=mode==="kcal"?"近"+chartRange+"天每日热量摄入":mode==="weight"?"近"+chartRange+"天体重记录":mode==="water"?"近"+chartRange+"天每日饮水量":"近"+chartRange+"天三大营养素摄入";
}
window.addEventListener("resize",()=>draw(currentChart));
render();initAuth();
</script>
