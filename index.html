n:10px 0;font-size:13px;color:#505358}.customGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.customHint{font-size:12px;color:var(--muted);margin:8px 0}.entryCard{background:white;border:1px solid #e1e2e4;border-radius:16px;padding:12px;margin:8px 0}.entryHead{display:flex;justify-content:space-between;align-items:center}.entryKcal{font-weight:800}.entryMacros{font-size:12px;color:var(--muted);margin-top:5px}.del{border:0;background:#f0f1f2;border-radius:9px;padding:6px 9px}.chartbox{height:240px;position:relative}.chartbox canvas{width:100%;height:100%}.tabs,.rangeTabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab,.range{border:0;background:#e1e3e6;padding:8px 12px;border-radius:11px;white-space:nowrap}.tab.active,.range.active{background:var(--dark);color:#fff}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted);margin:4px 0 8px}.legendDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.source{font-size:11px;color:#85888c;text-align:center;padding:4px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#202225;color:white;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;border-radius:24px;width:min(92vw,620px);padding:0;background:var(--card);box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.4)}.modal{padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:#e1e3e6;border-radius:10px;padding:7px 10px}.list{max-height:60vh;overflow:auto}.fooditem{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.cat{font-size:11px;color:var(--muted)}.goalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.accountStatus{font-size:12px;color:var(--muted);margin:0 0 10px}.cloud{font-size:11px;color:#6d7175;margin-top:8px}@media(max-width:560px){.hero{grid-template-columns:125px 1fr}.ring{width:118px;height:118px}.ringin b{font-size:22px}.stat{grid-template-columns:45px 1fr 48px}.formgrid{grid-template-columns:95px 1fr}}

<body><div class="app">
<header><div><h1>营养Pro</h1><div class="date" id="today"></div></div><div style="display:flex;gap:7px"><button type="button" class="iconbtn" id="account">☁︎</button><button type="button" class="iconbtn" id="settings">⚙︎</button></div></header>

<section class="card hero">
<div class="ring" id="ring"><div class="ringin"><b id="kcalNow">0</b><span>今日 kcal</span></div></div>
<div class="stats">
<div class="stat"><b>蛋白</b><div class="bar"><div class="fill fp" id="pbar"></div></div><div class="num"><span id="pnow">0</span>/<span id="pgoal">140</span>g</div></div>
<div class="stat"><b>碳水</b><div class="bar"><div class="fill fc" id="cbar"></div></div><div class="num"><span id="cnow">0</span>/<span id="cgoal">250</span>g</div></div>
<div class="stat"><b>脂肪</b><div class="bar"><div class="fill ff" id="fbar"></div></div><div class="num"><span id="fnow">0</span>/<span id="fgoal">70</span>g</div></div>
</div></section>

<section class="card"><h2>添加食物</h2>
<div class="meal"><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select><input id="grams" type="number" min="0" value="100" placeholder="克"></div>
<div class="foodpick"><button class="btn secondary" id="pick" style="flex:1;text-align:left">选择食物：<span id="selectedName">燕麦片</span></button><button class="btn secondary" id="customBtn">自定义</button></div>
<div class="preview" id="preview"></div>
<div id="customArea" style="display:none"><div class="customHint">直接输入这一次食物的三大营养素和热量</div><div class="customGrid"><input id="cn" placeholder="食物名称"><input id="ck" type="number" placeholder="热量 kcal"><input id="cp" type="number" placeholder="蛋白质 g"><input id="cc" type="number" placeholder="碳水 g"><input id="cf" type="number" placeholder="脂肪 g"></div></div>
<button class="btn" id="add" style="width:100%;margin-top:10px">添加到今日记录</button>
</section>

<section class="card"><h2>今日记录</h2><div id="entries"></div></section>

<section class="card"><h2>近几天变化</h2>
<div class="tabs"><button class="tab active" data-chart="kcal">热量</button><button class="tab" data-chart="macro">三大营养素</button><button class="tab" data-chart="weight">体重</button><button class="tab" data-chart="water">饮水</button></div>
<div class="rangeTabs"><button class="range active" data-range="7">7天</button><button class="range" data-range="14">14天</button><button class="range" data-range="30">30天</button></div>
<div class="legend" id="legend"></div><div class="chartbox"><canvas id="chart"></canvas></div>
</section>

<section class="card"><h2>快捷功能</h2><div class="grid"><button class="btn secondary" id="waterBtn">💧 +250 ml</button><button class="btn secondary" id="weightBtn">⚖︎ 记录体重</button><button class="btn secondary" id="backupBtn">备份数据</button><button class="btn secondary" id="resetBtn">清空今日记录</button></div><div class="cloud" id="cloudStatus">本地数据正常保存</div></section>
<div class="source">营养数值为参考值（通常按每100g/100ml）；品牌食品请以包装营养成分表为准。</div>
</div>

<dialog id="foodDlg"><div class="modal"><div class="modalhead"><h2>选择食物</h2><button class="close" onclick="foodDlg.close()">关闭</button></div><input id="foodSearch" placeholder="搜索食物"><button class="btn secondary" id="addCustomFoodBtn" style="width:100%;margin:8px 0">＋ 自定义食物</button><div class="list" id="foodList"></div></div></dialog>
<dialog id="setDlg"><div class="modal"><div class="modalhead"><h2>每日目标</h2><button class="close" onclick="setDlg.close()">关闭</button></div><div class="goalGrid"><input id="gk" type="number" placeholder="热量 kcal"><input id="gp" type="number" placeholder="蛋白质 g"><input id="gc" type="number" placeholder="碳水 g"><input id="gf" type="number" placeholder="脂肪 g"></div><button class="btn" id="saveGoals" style="width:100%;margin-top:10px">保存目标</button></div></dialog>
<dialog id="customFoodDlg"><div class="modal"><div class="modalhead"><h2>添加自定义食物</h2><button class="close" onclick="customFoodDlg.close()">关闭</button></div><input id="fn" placeholder="食物名称"><div class="customGrid" style="margin-top:10px"><input id="fk" type="number" placeholder="每100g kcal"><input id="fp" type="number" placeholder="蛋白质 g"><input id="fc" type="number" placeholder="碳水 g"><input id="ff" type="number" placeholder="脂肪 g"></div><button class="btn" id="saveCustomFood" style="width:100%;margin-top:10px">保存</button></div></dialog>
<dialog id="weiDlg"><div class="modal"><div class="modalhead"><h2>记录体重</h2><button class="close" onclick="weiDlg.close()">关闭</button></div><input id="weight" type="number" step="0.1" placeholder="kg"><button class="btn" id="saveWeight" style="width:100%;margin-top:10px">保存</button></div></dialog>
<dialog id="accDlg"><div class="modal"><div class="modalhead"><h2>云端同步</h2><button class="close" onclick="accDlg.close()">关闭</button></div><p class="accountStatus" id="accStatus">未登录</p><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码" style="margin-top:8px"><div class="grid" style="margin-top:10px"><button class="btn" id="loginBtn">登录</button><button class="btn secondary" id="signupBtn">注册</button></div><button class="btn secondary" id="logoutBtn" style="width:100%;margin-top:8px;display:none">退出登录</button><div class="customHint" style="margin-top:12px">登录后会自动同步食物记录、自定义食物、饮水、体重和每日目标。首次登录若云端为空，会把当前手机/电脑上的本地数据上传到云端。</div></div></dialog>
<div class="toast" id="toast"></div>

const SUPABASE_KEY="sb_publishable_d_3FgchBD14GQxLjVzMPMA_F8ifg5E3";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var S=null;try{S=JSON.parse(localStorage.getItem("nutritionPro3")||"null")}catch(e){}
if(!S)S={entries:[],weights:{},water:{},goals:{kcal:2200,p:140,c:250,f:70},selected:"燕麦片",customFoods:[]};
S.entries=S.entries||[];S.weights=S.weights||{};S.water=S.water||{};S.goals=S.goals||{kcal:2200,p:140,c:250,f:70};S.customFoods=S.customFoods||[];
function $(id){return document.getElementById(id)}
function day(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){try{localStorage.setItem("nutritionPro3",JSON.stringify(S))}catch(e){}}
function food(){return FOODS.find(f=>f.name===S.selected)||S.customFoods.find(f=>f.name===S.selected)||FOODS[0]}
function totals(d=day()){let a={kcal:0,p:0,c:0,f:0};S.entries.forEach(e=>{if(e.date===d){a.kcal+=+e.kcal||0;a.p+=+e.p||0;a.c+=+e.c||0;a.f+=+e.f||0}});return a}
function calc(){let f=food(),m=(+$("grams").value||0)/100;return{kcal:f.kcal*m,p:f.p*m,c:f.c*m,f:f.f*m}}
function toast(t){let e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove("show"),1500)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

 let t=totals(),g=S.goals, pct=Math.min(1,t.kcal/(g.kcal||1)),deg=pct*360;

function draw(mode){
 let cv=$("chart"),box=cv.parentElement,w=box.clientWidth||500,h=box.clientHeight||240,dpr=devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;let c=cv.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
 let labels=[], vals=[];for(let i=rangeDays-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");labels.push(ds.slice(5));let t=totals(ds);if(mode==="kcal")vals.push([t.kcal]);else if(mode==="macro")vals.push([t.p,t.c,t.f]);else if(mode==="weight")vals.push([S.weights[ds]!=null?+S.weights[ds]:null]);else vals.push([S.water[ds]||0])}
 $("legend").innerHTML=mode==="macro"?'<span>● 蛋白</span><span>● 碳水</span><span>● 脂肪</span>':mode==="weight"?"体重 kg":mode==="water"?"饮水 ml":"热量 kcal";
 let pad={l:35,r:10,t:15,b:25},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=1;
 vals.forEach(v=>v.forEach(x=>{if(x!=null)max=Math.max(max,x)}));if(mode==="macro")max=Math.max(50,max);
 c.strokeStyle="#d4d6d9";c.lineWidth=1;for(let j=0;j<4;j++){let y=pad.t+ch*j/3;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke()}
 let cols=["#4f78ff","#35a56b","#e39a38"];
 for(let k=0;k<vals[0].length;k++){c.strokeStyle=cols[k]||"#25272a";c.lineWidth=2;c.beginPath();let started=false;vals.forEach((v,i)=>{let x=pad.l+(rangeDays===1?0:i/(rangeDays-1))*cw,y=v[k]==null?0:pad.t+ch-(v[k]/max)*ch;if(v[k]==null){started=false;return}if(!started){c.moveTo(x,y);started=true}else c.lineTo(x,y)});c.stroke()}
 c.fillStyle="#777a7e";c.font="11px -apple-system,BlinkMacSystemFont,sans-serif";labels.forEach((lab,i)=>{if(i===0||i===labels.length-1||i===Math.floor(labels.length/2)){let x=pad.l+(rangeDays===1?0:i/(rangeDays-1))*cw;c.fillText(lab,x-12,h-7)}})
}
function updateAccountUI(){sb.auth.getSession().then(({data})=>{let u=data.session?.user;$("accStatus").textContent=u?`已登录：${u.email}`:"未登录";$("logoutBtn").style.display=u?"block":"none";$("cloudStatus").textContent=u?"☁︎ 云端已登录，数据会自动同步":"本地数据正常保存 · 登录后可跨设备同步"})}
let syncBusy=false;
function cloudErr(e){console.error(e);$("cloudStatus").textContent="☁︎ 云端同步失败，本地数据仍可用"}
async function getUser(){try{let {data:{session}}=await sb.auth.getSession();return session?.user||null}catch(e){return null}}

async function cloudLoadOrMigrate(){
 let u=await getUser();if(!u||syncBusy)return;syncBusy=true;
 try{
  let [fe,cf,wa,we,go]=await Promise.all([
   sb.from("food_entries").select("*").eq("user_id",u.id).order("created_at",{ascending:true}),
   sb.from("custom_foods").select("*").eq("user_id",u.id).order("name"),
   sb.from("water_entries").select("*").eq("user_id",u.id),
   sb.from("weight_entries").select("*").eq("user_id",u.id),
   sb.from("user_goals").select("*").eq("user_id",u.id).maybeSingle()
  ]);
  for(let r of [fe,cf,wa,we,go])if(r.error)throw r.error;
  let hasCloud=(fe.data?.length||0)+(cf.data?.length||0)+(wa.data?.length||0)+(we.data?.length||0)+(go.data?1:0);
  let hasLocal=S.entries.length+S.customFoods.length+Object.keys(S.water).length+Object.keys(S.weights).length;
  if(!hasCloud&&hasLocal){await cloudPushAll();toast("本地数据已上传云端");$("cloudStatus").textContent="☁︎ 已同步到云端";return}
  S.entries=(fe.data||[]).map(x=>({id:x.id,date:x.entry_date,food:x.food,meal:x.meal,grams:+x.grams||0,kcal:+x.calories||0,p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0}));
  S.customFoods=(cf.data||[]).map(x=>({id:x.id,name:x.name,cat:x.category||"自定义",kcal:+x.calories||0,p:+x.protein||0,c:+x.carbs||0,f:+x.fat||0}));
  S.water={};(wa.data||[]).forEach(x=>S.water[x.entry_date]=(S.water[x.entry_date]||0)+(+x.amount_ml||0));
  S.weights={};(we.data||[]).forEach(x=>S.weights[x.entry_date]=+x.weight||0);
  if(go.data)S.goals={kcal:+go.data.calories||2200,p:+go.data.protein||140,c:+go.data.carbs||250,f:+go.data.fat||70};
  save();render();$("cloudStatus").textContent="☁︎ 云端已同步";toast("云端数据已同步");
 }catch(e){cloudErr(e)}finally{syncBusy=false}
}
async function cloudPushAll(){
 let u=await getUser();if(!u)return;let uid=u.id;
 for(let t of ["food_entries","custom_foods","water_entries","weight_entries","user_goals"]){let r=await sb.from(t).delete().eq("user_id",uid);if(r.error)throw r.error}
 if(S.entries.length){let r=await sb.from("food_entries").insert(S.entries.map(e=>({user_id:uid,entry_date:e.date,food:e.food,meal:e.meal,grams:+e.grams||0,calories:+e.kcal||0,protein:+e.p||0,carbs:+e.c||0,fat:+e.f||0}))).select("id");if(r.error)throw r.error;if(r.data)S.entries.forEach((e,i)=>e.id=r.data[i]?.id||e.id)}
 if(S.customFoods.length){let r=await sb.from("custom_foods").insert(S.customFoods.map(f=>({user_id:uid,name:f.name,category:f.cat||"自定义",calories:+f.kcal||0,protein:+f.p||0,carbs:+f.c||0,fat:+f.f||0}))).select("id");if(r.error)throw r.error;if(r.data)S.customFoods.forEach((f,i)=>f.id=r.data[i]?.id||f.id)}
 let wr=Object.entries(S.water).filter(x=>+x[1]>0).map(x=>({user_id:uid,entry_date:x[0],amount_ml:+x[1]}));if(wr.length){let r=await sb.from("water_entries").insert(wr);if(r.error)throw r.error}
 let ir=Object.entries(S.weights).filter(x=>+x[1]>0).map(x=>({user_id:uid,entry_date:x[0],weight:+x[1]}));if(ir.length){let r=await sb.from("weight_entries").insert(ir);if(r.error)throw r.error}
 let g=await sb.from("user_goals").upsert({user_id:uid,calories:+S.goals.kcal||2200,protein:+S.goals.p||140,carbs:+S.goals.c||250,fat:+S.goals.f||70},{onConflict:"user_id"});if(g.error)throw g.error
 save()
}
async function syncEntry(e){let u=await getUser();if(!u)return;try{let r=await sb.from("food_entries").insert({user_id:u.id,entry_date:e.date,food:e.food,meal:e.meal,grams:+e.grams||0,calories:+e.kcal||0,protein:+e.p||0,carbs:+e.c||0,fat:+e.f||0}).select("id").single();if(r.error)throw r.error;e.id=r.data.id;save()}catch(x){cloudErr(x)}}
async function syncDeleteEntry(e){let u=await getUser();if(!u||!e?.id)return;try{let r=await sb.from("food_entries").delete().eq("user_id",u.id).eq("id",e.id);if(r.error)throw r.error}catch(x){cloudErr(x)}}
async function syncGoals(){let u=await getUser();if(!u)return;try{let r=await sb.from("user_goals").upsert({user_id:u.id,calories:+S.goals.kcal||2200,protein:+S.goals.p||140,carbs:+S.goals.c||250,fat:+S.goals.f||70},{onConflict:"user_id"});if(r.error)throw r.error}catch(x){cloudErr(x)}}
async function syncCustomFood(f){let u=await getUser();if(!u)return;try{let r=await sb.from("custom_foods").insert({user_id:u.id,name:f.name,category:f.cat||"自定义",calories:+f.kcal||0,protein:+f.p||0,carbs:+f.c||0,fat:+f.f||0}).select("id").single();if(r.error)throw r.error;f.id=r.data.id;save()}catch(x){cloudErr(x)}}
async function syncDayValues(){let u=await getUser();if(!u)return;let d=day();try{let a=await sb.from("water_entries").delete().eq("user_id",u.id).eq("entry_date",d);if(a.error)throw a.error;if((+S.water[d]||0)>0){let r=await sb.from("water_entries").insert({user_id:u.id,entry_date:d,amount_ml:+S.water[d]});if(r.error)throw r.error}let b=await sb.from("weight_entries").delete().eq("user_id",u.id).eq("entry_date",d);if(b.error)throw b.error;if((+S.weights[d]||0)>0){let r=await sb.from("weight_entries").insert({user_id:u.id,entry_date:d,weight:+S.weights[d]});if(r.error)throw r.error}}catch(x){cloudErr(x)}}


$("addCustomFoodBtn").onclick=()=>{["fn","fk","fp","fc","ff"].forEach(id=>$(id).value="");customFoodDlg.showModal()}
$("saveCustomFood").onclick=async()=>{let name=$("fn").value.trim(),k=+$("fk").value,p=+$("fp").value,c=+$("fc").value,f=+$("ff").value;if(!name)return toast("请输入食物名称");if([k,p,c,f].some(v=>!Number.isFinite(v)||v<0))return toast("请完整填写营养数据");if(S.customFoods.some(x=>x.name===name))return toast("已有同名自定义食物");let item={id:crypto.randomUUID(),name,cat:"自定义",kcal:k,p,c,f};S.customFoods.push(item);save();customFoodDlg.close();foodList();render();await syncCustomFood(item);toast("自定义食物已保存")}

$("pick").onclick=()=>{foodDlg.showModal();foodList();$("foodSearch").focus()}
$("foodSearch").oninput=foodList;
$("customBtn").onclick=()=>{customMode=!customMode;render()}
$("grams").oninput=render;
$("add").onclick=()=>{let e;if(customMode){let name=$("cn").value.trim();if(!name)return toast("请输入食物名称");e={food:name,meal:$("meal").value,grams:+$("grams").value||0,kcal:+$("ck").value||0,p:+$("cp").value||0,c:+$("cc").value||0,f:+$("cf").value||0}}else{let q=calc();e={food:food().name,meal:$("meal").value,grams:+$("grams").value||0,...q}}e.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());e.date=day();S.entries.push(e);save();render();syncEntry(e);toast("已添加")}
$("settings").onclick=()=>{gk.value=S.goals.kcal;gp.value=S.goals.p;gc.value=S.goals.c;gf.value=S.goals.f;setDlg.showModal()}
$("saveGoals").onclick=()=>{S.goals={kcal:+gk.value||2200,p:+gp.value||140,c:+gc.value||250,f:+gf.value||70};save();render();syncGoals();setDlg.close();toast("目标已保存")}
$("waterBtn").onclick=()=>{let d=day();S.water[d]=(S.water[d]||0)+250;save();render();syncDayValues();toast("饮水 +250 ml")}
$("weightBtn").onclick=()=>{weight.value=S.weights[day()]||"";weiDlg.showModal()}
$("saveWeight").onclick=()=>{let v=+weight.value;if(!v)return toast("请输入体重");S.weights[day()]=v;save();render();syncDayValues();weiDlg.close();toast("体重已保存")}
$("backupBtn").onclick=()=>{let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="营养Pro-备份-"+day()+".json";a.click();URL.revokeObjectURL(a.href)}
$("resetBtn").onclick=async()=>{if(!confirm("确定清空今天的饮食记录吗？"))return;let {data:{session}}=await sb.auth.getSession();if(session)await sb.from("food_entries").delete().eq("user_id",session.user.id).eq("entry_date",day());S.entries=S.entries.filter(e=>e.date!==day());save();render();toast("已清空今天记录")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentChart=b.dataset.chart;draw(currentChart)})
document.querySelectorAll(".range").forEach(b=>b.onclick=()=>{document.querySelectorAll(".range").forEach(x=>x.classList.remove("active"));b.classList.add("active");rangeDays=+b.dataset.range;draw(currentChart)})
window.addEventListener("resize",()=>draw(currentChart));

$("account").onclick=()=>{updateAccountUI();accDlg.showModal()}
$("loginBtn").onclick=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||!password)return toast("请输入邮箱和密码");$("loginBtn").disabled=true;let r=await sb.auth.signInWithPassword({email,password});$("loginBtn").disabled=false;if(r.error)return toast(r.error.message);accDlg.close();await cloudLoadOrMigrate();toast("登录成功")}
$("signupBtn").onclick=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||!password)return toast("请输入邮箱和密码");if(password.length<6)return toast("密码至少6位");$("signupBtn").disabled=true;let r=await sb.auth.signUp({email,password});$("signupBtn").disabled=false;if(r.error)return toast(r.error.message);if(r.data.session){accDlg.close();await cloudLoadOrMigrate();toast("注册成功")}else toast("注册成功，请查收邮箱验证邮件")}
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();S={entries:[],weights:{},water:{},goals:{kcal:2200,p:140,c:250,f:70},selected:"燕麦片",customFoods:[]};save();render();accDlg.close();toast("已退出登录")}
sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{updateAccountUI();if(session&&(event==="SIGNED_IN"||event==="INITIAL_SESSION"))cloudLoadOrMigrate()},0)});

render();updateAccountUI();
</script></body></html>
