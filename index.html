<style>

<style>
.goalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

.goalGrid input{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:11px 10px;border:1px solid #ddd;border-radius:12px;background:#f7f7f8;font-size:16px}
.primary{width:100%;border:0;border-radius:12px;padding:12px;background:#17181a;color:#fff;font-weight:700}

.chartTabs button{border:0;border-radius:10px;padding:7px 12px;background:#eee;color:#555}

.entry{position:relative;padding:12px 0;border-bottom:1px solid #eee}
.entryTop{display:flex;justify-content:space-between;gap:10px}
.entryTop span{font-size:12px;color:#777;background:#f0f0f2;border-radius:8px;padding:4px 7px}
.entrySub{font-size:12px;color:#888;margin:5px 0}
.macroRow{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}

.macroRow .mp{color:#4168d8}.macroRow .mc{color:#16824f}.macroRow .mf{color:#b66a12}
.del{position:absolute;right:0;bottom:10px;border:0;background:none;color:#a33;font-size:12px}

<header><div><h1>营养Pro</h1><div class="date" id="today"></div></div><button type="button" class="iconbtn" id="settings">⚙︎</button></header>

<div class="stat"><span>蛋白质</span><div class="bar"><div class="fill" id="pb"></div></div><span class="num" id="pn">0g</span></div>
<div class="stat"><span>碳水</span><div class="bar"><div class="fill" id="cb"></div></div><span class="num" id="cn">0g</span></div>
<div class="stat"><span>脂肪</span><div class="bar"><div class="fill" id="fb"></div></div><span class="num" id="fn">0g</span></div>
<div class="small muted" id="remain"></div></div></section>
<section class="card"><h2>添加食物</h2><div class="formgrid"><div><label>餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></div><div><label>重量（g）</label><input id="grams" type="number" value="100" min="1" inputmode="decimal"></div></div>
<label>食物</label><button type="button" class="btn secondary" id="pick" style="width:100%;text-align:left">选择食物：燕麦片</button><div class="small muted" id="preview" style="margin:8px 0"></div><button type="button" class="btn" id="add" style="width:100%">＋ 添加到今天</button></section>
<section class="card"><h2>今日记录</h2><div id="entries"></div></section>
<section class="card"><h2>近几天变化</h2><div class="tabs"><button type="button" class="tab on" data-m="kcal">热量</button><button type="button" class="tab" data-m="macro">三大营养素</button><button type="button" class="tab" data-m="weight">体重</button></div><div class="rangeTabs"><button type="button" class="range on" data-range="7">7天</button><button type="button" class="range" data-range="14">14天</button><button type="button" class="range" data-range="30">30天</button></div><div class="chartbox"><canvas id="chart" width="700" height="260"></canvas></div><div id="chartLegend" class="legend"></div><div class="small muted" id="chartNote" style="margin-top:8px"></div></section>
<section class="card"><h2>快捷功能</h2><div class="grid"><button type="button" class="btn secondary" id="water">💧 喝水 250ml</button><button type="button" class="btn secondary" id="weight">⚖︎ 记录体重</button><button type="button" class="btn secondary" id="backup">↥ 备份数据</button><button type="button" class="btn secondary" id="reset">↺ 今日清空</button></div></section>
<div class="source">食物数值为每100g标准参考值；生熟状态、品种、品牌和烹饪方式会造成差异。品牌食品请优先以包装营养标签为准。</div>
</div>
<dialog id="foodDlg"><div class="modal"><h2>选择食物</h2><input id="search" placeholder="搜索食物，例如：鸡胸、燕麦、香蕉"><div class="list" id="foodList"></div><button type="button" class="btn secondary" id="closeFood" style="width:100%;margin-top:12px">关闭</button></div></dialog>
<dialog id="setDlg"><div class="modal"><h2>每日目标</h2><label>热量 kcal</label><input id="gk" inputmode="decimal"><label>蛋白质 g</label><input id="gp" inputmode="decimal"><label>碳水 g</label><input id="gc" inputmode="decimal"><label>脂肪 g</label><input id="gf" inputmode="decimal"><div class="grid" style="margin-top:14px"><button type="button" class="btn" id="saveSet">保存</button><button type="button" class="btn secondary" id="closeSet">关闭</button></div></div></dialog>
<dialog id="weiDlg"><div class="modal"><h2>记录体重</h2><label>体重 kg</label><input id="wi" type="number" step=".1" inputmode="decimal"><div class="grid" style="margin-top:14px"><button type="button" class="btn" id="saveW">保存</button><button type="button" class="btn secondary" id="closeW">关闭</button></div></div></dialog>

function $(id){return document.getElementById(id);}
function day(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

 $("kcal").textContent=Math.round(t.kcal);
 $("ring").style.setProperty("--deg",Math.min(360,t.kcal/Math.max(1,g.kcal)*360)+"deg");
 var rows=[["pb",t.p,g.p,"pn"],["cb",t.c,g.c,"cn"],["fb",t.f,g.f,"fn"]];
 for(var i=0;i<rows.length;i++){var r=rows[i];$(r[0]).style.width=Math.min(100,r[1]/Math.max(1,r[2])*100)+"%";$(r[3]).textContent=r[1].toFixed(1)+"g";}
 $("remain").textContent="剩余 "+Math.max(0,Math.round(g.kcal-t.kcal))+" kcal";
 var v=calc();$("pick").textContent="选择食物："+food().name;
 $("preview").textContent=($("grams").value||0)+"g · "+v.kcal.toFixed(0)+" kcal · 蛋白质 "+v.p.toFixed(1)+"g · 碳水 "+v.c.toFixed(1)+"g · 脂肪 "+v.f.toFixed(1)+"g";
 var es=[];for(var j=0;j<S.entries.length;j++)if(S.entries[j].date===day())es.push({e:S.entries[j],idx:j});
 if(!es.length){$("entries").innerHTML='<div class="empty">今天还没有记录</div>';}
 else{
  var out="";
  for(var k=0;k<es.length;k++){
    var e=es[k].e;
    out+='<div class="entryCard">'+
      '<div class="entryHead"><div><b>'+esc(e.food)+'</b><div class="small muted">'+esc(e.meal)+' · '+e.grams+'g</div></div>'+
      '<button type="button" class="del" data-index="'+es[k].idx+'">×</button></div>'+
      '<div class="entryKcal">'+Math.round(e.kcal)+' kcal</div>'+
      '<div class="entryMacros"><span class="p">蛋白质 '+Number(e.p).toFixed(1)+'g</span><span class="c">碳水 '+Number(e.c).toFixed(1)+'g</span><span class="f">脂肪 '+Number(e.f).toFixed(1)+'g</span></div>'+
      '</div>';
  }
  $("entries").innerHTML=out;
  var ds=$("entries").querySelectorAll(".del");for(var z=0;z<ds.length;z++)ds[z].addEventListener("click",function(){var idx=Number(this.getAttribute("data-index"));S.entries.splice(idx,1);save();render();toast("已删除");});
 }
 draw(currentChart);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function foodList(){
 var q=$("search").value.trim().toLowerCase(), groups={},arr=[];
 for(var i=0;i<FOODS.length;i++){if(!q||FOODS[i].name.toLowerCase().indexOf(q)>=0)arr.push(FOODS[i]);}
 for(var j=0;j<arr.length;j++){var f=arr[j];if(!groups[f.cat])groups[f.cat]=[];groups[f.cat].push(f);}
 var out="";
 for(var c in groups){out+='<div class="cat">'+esc(c)+'</div>';for(var k=0;k<groups[c].length;k++){var f2=groups[c][k];out+='<button type="button" class="fooditem" data-food="'+encodeURIComponent(f2.name)+'"><b>'+esc(f2.name)+'</b><span class="small muted"> · '+f2.kcal+' kcal · P '+f2.p+'g · C '+f2.c+'g · F '+f2.f+'g /100g</span></button>';}}
 $("foodList").innerHTML=out||'<div class="empty">没有找到</div>';
 var bs=$("foodList").querySelectorAll(".fooditem");for(var n=0;n<bs.length;n++)bs[n].addEventListener("click",function(){S.selected=decodeURIComponent(this.getAttribute("data-food"));save();$("foodDlg").close();render();toast("已选择 "+S.selected);});
}
function openDlg(d){try{if(typeof d.showModal==="function")d.showModal();else d.setAttribute("open","");}catch(e){d.setAttribute("open","");}}
function closeDlg(d){try{d.close();}catch(e){d.removeAttribute("open");}}

var currentChart="kcal";
$("pick").addEventListener("click",function(){openDlg($("foodDlg"));$("search").value="";foodList();});
$("closeFood").addEventListener("click",function(){closeDlg($("foodDlg"));});
$("search").addEventListener("input",foodList);
$("grams").addEventListener("input",render);

$("add").addEventListener("click",function(){
 var grams=Number($("grams").value);
 if(!isFinite(grams)||grams<=0){toast("请输入有效重量");$("grams").focus();return;}
 var v=calc();
 var f=food();
 S.entries.push({date:day(),meal:$("meal").value,food:f.name,grams:grams,kcal:v.kcal,p:v.p,c:v.c,f:v.f});
 save();render();toast("✓ 已添加 "+f.name+" "+grams+"g");
});

$("settings").addEventListener("click",function(){$("gk").value=S.goals.kcal;$("gp").value=S.goals.p;$("gc").value=S.goals.c;$("gf").value=S.goals.f;openDlg($("setDlg"));});
$("closeSet").addEventListener("click",function(){closeDlg($("setDlg"));});
$("saveSet").addEventListener("click",function(){S.goals={kcal:Number($("gk").value)||2200,p:Number($("gp").value)||140,c:Number($("gc").value)||250,f:Number($("gf").value)||70};save();closeDlg($("setDlg"));render();toast("目标已保存");});

$("water").addEventListener("click",function(){S.water[day()]=(Number(S.water[day()])||0)+250;save();toast("今日饮水 "+S.water[day()]+" ml");});
$("weight").addEventListener("click",function(){$("wi").value=S.weights[day()]||"";openDlg($("weiDlg"));});
$("closeW").addEventListener("click",function(){closeDlg($("weiDlg"));});
$("saveW").addEventListener("click",function(){var v=Number($("wi").value);if(v>0){S.weights[day()]=v;save();closeDlg($("weiDlg"));currentChart="weight";setTabs("weight");render();toast("体重已保存");}});
$("backup").addEventListener("click",function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="营养Pro备份-"+day()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);toast("备份已生成");});
$("reset").addEventListener("click",function(){if(confirm("确定清空今天所有记录？")){S.entries=S.entries.filter(function(e){return e.date!==day();});save();render();toast("今日已清空");}});

function setTabs(mode){var tabs=document.querySelectorAll(".tab");for(var i=0;i<tabs.length;i++){tabs[i].classList.toggle("on",tabs[i].getAttribute("data-m")===mode);}}
var tabs=document.querySelectorAll(".tab");for(var ti=0;ti<tabs.length;ti++)tabs[ti].addEventListener("click",function(){currentChart=this.getAttribute("data-m");setTabs(currentChart);draw(currentChart);});

function draw(mode){
 var c=$("chart"),box=c.parentElement;
 var rect=box.getBoundingClientRect(),W=Math.max(320,Math.floor(rect.width-16)),H=190,dpr=window.devicePixelRatio||1;
 c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width="100%";c.style.height=H+"px";
 var x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);

 var daysCount=chartRange||7,ds=[];
 for(var i=daysCount-1;i>=0;i--){
   var d=new Date();d.setDate(d.getDate()-i);
   ds.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
 }
 var labels=ds.map(function(d){return d.slice(5).replace("-","/");});
 var series=[];
 if(mode==="kcal") series=[{name:"热量",data:ds.map(function(d){return totals(d).kcal;}),color:"#202225"}];
 else if(mode==="weight") series=[{name:"体重",data:ds.map(function(d){return S.weights[d]||null;}),color:"#7a7d82"}];
 else series=[
   {name:"蛋白质",data:ds.map(function(d){return totals(d).p;}),color:"#4f7cff"},
   {name:"碳水",data:ds.map(function(d){return totals(d).c;}),color:"#20a464"},
   {name:"脂肪",data:ds.map(function(d){return totals(d).f;}),color:"#e58a22"}
 ];

 var vals=[];
 series.forEach(function(s){s.data.forEach(function(v){if(v!==null&&isFinite(v))vals.push(v);});});
 var max=Math.max.apply(null,vals.concat([1]));
 var min=0;
 if(mode==="weight"&&vals.length){min=Math.max(0,Math.floor(Math.min.apply(null,vals)-1));max=Math.max(max,Math.ceil(Math.max.apply(null,vals)+1));}
 else max=max*1.15;

 var L=38,R=10,T=20,B=30,pw=(W-L-R)/Math.max(1,daysCount-1),ph=H-T-B;
 x.font="11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif";
 x.strokeStyle="#dfe1e4";x.lineWidth=1;
 for(var gi=0;gi<=4;gi++){
   var yy=T+ph*gi/4;
   x.beginPath();x.moveTo(L,yy);x.lineTo(W-R,yy);x.stroke();
   x.fillStyle="#8a8d91";x.fillText(Math.round(max-(max-min)*gi/4),4,yy+4);
 }
 var step=Math.max(1,Math.ceil(daysCount/7));
 labels.forEach(function(lab,i){
   if(i%step!==0 && i!==labels.length-1)return;
   var xx=L+i*pw;
   x.fillStyle="#888";x.fillText(lab,Math.max(L,xx-14),H-8);
 });

 series.forEach(function(s){
   x.strokeStyle=s.color;x.lineWidth=2.5;x.lineJoin="round";x.lineCap="round";x.beginPath();
   var started=false;
   s.data.forEach(function(v,i){
     if(v===null||!isFinite(v)){started=false;return;}
     var xx=L+i*pw,yy=T+ph-(v-min)/(max-min||1)*ph;
     if(!started){x.moveTo(xx,yy);started=true;}else{x.lineTo(xx,yy);}
   });
   x.stroke();
   s.data.forEach(function(v,i){
     if(v===null||!isFinite(v))return;
     var xx=L+i*pw,yy=T+ph-(v-min)/(max-min||1)*ph;
     x.fillStyle=s.color;x.beginPath();x.arc(xx,yy,2.5,0,Math.PI*2);x.fill();
   });
 });

 var legend=$("chartLegend");
 if(mode==="macro"){
   legend.innerHTML='<span><i class="legendDot p"></i>蛋白质</span><span><i class="legendDot c"></i>碳水</span><span><i class="legendDot f"></i>脂肪</span>';
 }else if(mode==="kcal"){
   legend.innerHTML='<span><i class="legendDot kcal"></i>热量</span>';
 }else{
   legend.innerHTML='<span><i class="legendDot weight"></i>体重</span>';
 }
 $("chartNote").textContent=mode==="kcal"?"近"+daysCount+"天每日热量摄入":mode==="weight"?"近"+daysCount+"天体重记录":"近"+daysCount+"天三大营养素摄入";
}

var chartRange=7;
var rangeBtns=document.querySelectorAll(".range");
for(var ri=0;ri<rangeBtns.length;ri++)rangeBtns[ri].addEventListener("click",function(){
  chartRange=Number(this.getAttribute("data-range"))||7;
  for(var rj=0;rj<rangeBtns.length;rj++)rangeBtns[rj].classList.remove("on");
  this.classList.add("on");
  draw(currentChart);
});

render();
</script></body></html>
