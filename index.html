<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="营养Pro">
<link rel="manifest" href="manifest.json">
<title>营养Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
header{padding:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;font-weight:800}.date{color:#6b7280;font-size:13px;margin-top:4px}
.card{background:white;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 20px #11182712}.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.ring{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#22c55e var(--deg),#e5e7eb 0);position:relative}
.ring:after{content:"";position:absolute;inset:12px;background:white;border-radius:50%}.ringtxt{position:relative;z-index:1;text-align:center}.ringtxt b{font-size:27px;display:block}.ringtxt span{font-size:12px;color:#6b7280}
.stats{display:grid;gap:10px}.stat{display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;font-size:13px}.bar{height:9px;background:#edf0f4;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#111827;border-radius:9px}.num{text-align:right;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:14px;padding:13px 12px;background:#111827;color:white;font-size:15px;font-weight:700}.btn.secondary{background:#eef2f7;color:#111827}.btn.green{background:#16a34a}.btn.danger{background:#ef4444}
h2{font-size:18px;margin:0 0 14px}.muted{color:#6b7280}.meal{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef0f3}.meal:last-child{border-bottom:0}.foodrow{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;background:#eef2ff;padding:4px 8px;border-radius:999px;color:#4f46e5}
input,select{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:12px;font-size:16px;background:white}label{font-size:12px;color:#6b7280;display:block;margin:8px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog{border:0;border-radius:22px;width:min(92vw,520px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h3{margin:0 0 10px}.list button{width:100%;text-align:left;background:white;border:0;border-bottom:1px solid #eee;padding:13px 4px;font-size:15px}
.empty{text-align:center;padding:22px;color:#9ca3af}.small{font-size:12px}.top-actions{display:flex;gap:8px}.top-actions button{width:42px;height:42px;border:0;border-radius:13px;background:#eef2f7;font-size:20px}
canvas{width:100%;height:180px;background:#fafbfc;border-radius:14px}
@media(max-width:520px){.hero{grid-template-columns:130px 1fr}.ring{width:125px;height:125px}.ringtxt b{font-size:23px}.stat{grid-template-columns:60px 1fr 45px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>营养Pro</h1><div class="date" id="today"></div></div><div class="top-actions"><button id="settingsBtn" aria-label="设置">⚙️</button></div></header>

<section class="card hero">
  <div class="ring" id="ring" style="--deg:0deg"><div class="ringtxt"><b id="kcal">0</b><span>kcal / 今日</span></div></div>
  <div class="stats">
    <div class="stat"><span>蛋白质</span><div class="bar"><div class="fill" id="pbar"></div></div><span class="num" id="pnum">0g</span></div>
    <div class="stat"><span>碳水</span><div class="bar"><div class="fill" id="cbar"></div></div><span class="num" id="cnum">0g</span></div>
    <div class="stat"><span>脂肪</span><div class="bar"><div class="fill" id="fbar"></div></div><span class="num" id="fnum">0g</span></div>
    <div class="small muted" id="remain">剩余热量 2200 kcal</div>
  </div>
</section>

<section class="card">
  <h2>添加食物</h2>
  <div class="formgrid">
    <div><label>餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></div>
    <div><label>重量（g）</label><input id="grams" type="number" inputmode="decimal" value="100" min="1"></div>
  </div>
  <label>食物</label><button class="btn secondary" id="foodPicker" style="width:100%;text-align:left">选择食物：燕麦片</button>
  <div class="small muted" id="preview" style="margin:9px 0">100g · 389 kcal · 蛋白质 16.9g · 碳水 66.3g · 脂肪 6.9g</div>
  <button class="btn green" id="addBtn" style="width:100%">＋ 添加到今天</button>
</section>

<section class="card"><h2>今天吃了什么</h2><div id="entries"></div></section>

<section class="card">
  <h2>快捷功能</h2>
  <div class="grid">
    <button class="btn secondary" id="waterBtn">💧 喝水 250ml</button>
    <button class="btn secondary" id="weightBtn">⚖️ 记录体重</button>
    <button class="btn secondary" id="statsBtn">📈 7天趋势</button>
    <button class="btn secondary" id="backupBtn">💾 备份数据</button>
  </div>
</section>
</div>

<dialog id="foodDialog"><div class="modal"><h3>选择食物</h3><input id="foodSearch" placeholder="搜索食物…"><div class="list" id="foodList"></div><button class="btn secondary" id="closeFood" style="width:100%;margin-top:10px">关闭</button></div></dialog>
<dialog id="settingsDialog"><div class="modal"><h3>每日目标</h3>
<label>热量 kcal</label><input id="gkcal" type="number">
<label>蛋白质 g</label><input id="gp" type="number">
<label>碳水 g</label><input id="gc" type="number">
<label>脂肪 g</label><input id="gf" type="number">
<label>纤维 g</label><input id="gfi" type="number">
<div class="grid" style="margin-top:14px"><button class="btn green" id="saveSettings">保存</button><button class="btn secondary" id="closeSettings">关闭</button></div>
</div></dialog>
<dialog id="weightDialog"><div class="modal"><h3>记录体重</h3><label>体重（kg）</label><input id="weightInput" type="number" step="0.1" inputmode="decimal"><div class="grid" style="margin-top:14px"><button class="btn green" id="saveWeight">保存</button><button class="btn secondary" id="closeWeight">关闭</button></div></div></dialog>
<dialog id="statsDialog"><div class="modal"><h3>7天趋势</h3><canvas id="chart" width="640" height="260"></canvas><div class="small muted" id="avgText" style="margin-top:10px"></div><button class="btn secondary" id="closeStats" style="width:100%;margin-top:12px">关闭</button></div></dialog>

<script>
const foods=[
["燕麦片",389,16.9,66.3,6.9,10.6],["鸡胸肉（熟）",165,31,0,3.6,0],["鸡蛋",143,12.6,.7,9.5,0],
["糯玉米",170,3.2,38,1.2,2.5],["白米饭",116,2.6,25.9,.3,.3],["西兰花",34,2.8,6.6,.4,2.6],
["香蕉",89,1.1,22.8,.3,2.6],["牛奶",54,3,3.4,3.2,0],["无糖希腊酸奶",59,10.3,3.6,.4,0],
["三文鱼",208,20.4,0,13.4,0],["瘦牛肉（熟）",217,26.1,0,11.8,0],["豆腐",76,8.1,1.9,4.2,.3],
["苹果",53,.3,13.7,.2,2.4],["红薯",86,1.6,20.1,.1,3],["虾仁",99,24,0,.3,0]
];
let state=JSON.parse(localStorage.getItem("nutritionPro")||"null")||{entries:[],water:{},weights:{},goals:{kcal:2200,p:140,c:250,f:70,fi:25},selected:foods[0][0]};
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem("nutritionPro",JSON.stringify(state))}
function selectedFood(){return foods.find(x=>x[0]===state.selected)||foods[0]}
function totals(){return state.entries.filter(e=>e.date===today()).reduce((a,e)=>{a.kcal+=e.kcal;a.p+=e.p;a.c+=e.c;a.f+=e.f;a.fi+=e.fi;return a},{kcal:0,p:0,c:0,f:0,fi:0})}
function render(){
$("today").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
const t=totals(),g=state.goals;
$("kcal").textContent=Math.round(t.kcal);
$("ring").style.setProperty("--deg",Math.min(360,t.kcal/g.kcal*360)+"deg");
[["pbar",t.p,g.p,"pnum"],["cbar",t.c,g.c,"cnum"],["fbar",t.f,g.f,"fnum"]].forEach(([b,v,max,n])=>{$(b).style.width=Math.min(100,v/max*100)+"%";$(n).textContent=v.toFixed(1)+"g"});
$("remain").textContent="剩余热量 "+Math.max(0,Math.round(g.kcal-t.kcal))+" kcal";
$("preview").textContent=`${$("grams").value||0}g · ${calc()[0].toFixed(0)} kcal · 蛋白质 ${calc()[1].toFixed(1)}g · 碳水 ${calc()[2].toFixed(1)}g · 脂肪 ${calc()[3].toFixed(1)}g`;
const list=state.entries.filter(e=>e.date===today());
$("entries").innerHTML=list.length?list.map((e,i)=>`<div class="meal"><div><b>${e.food}</b><div class="small muted">${e.meal} · ${e.grams}g</div></div><div class="foodrow"><span class="tag">${Math.round(e.kcal)} kcal</span><button onclick="removeEntry(${i})" style="border:0;background:none;color:#ef4444;font-size:18px">×</button></div></div>`).join(""):'<div class="empty">今天还没有记录，先添加第一份食物吧。</div>';
}
function calc(){const f=selectedFood(),m=(parseFloat($("grams").value)||0)/100;return [f[1]*m,f[2]*m,f[3]*m,f[4]*m,f[5]*m]}
function removeEntry(localIndex){const ids=state.entries.map((e,i)=>e.date===today()?i:-1).filter(i=>i>=0);state.entries.splice(ids[localIndex],1);save();render()}
$("foodPicker").onclick=()=>{$("foodDialog").showModal();renderFoods()}
$("closeFood").onclick=()=>$("foodDialog").close()
$("foodSearch").oninput=renderFoods
function renderFoods(){const q=$("foodSearch").value.trim().toLowerCase();$("foodList").innerHTML=foods.filter(f=>f[0].toLowerCase().includes(q)).map(f=>`<button onclick="pickFood('${f[0].replaceAll("'","\\'")}')"><b>${f[0]}</b><span class="small muted"> · ${f[1]} kcal/100g</span></button>`).join("")}
function pickFood(n){state.selected=n;save();$("foodDialog").close();render()}
$("grams").oninput=render
$("addBtn").onclick=()=>{const f=selectedFood(),v=calc();if(v[0]<=0)return alert("请输入有效重量");state.entries.push({date:today(),meal:$("meal").value,food:f[0],grams:+$("grams").value,kcal:v[0],p:v[1],c:v[2],f:v[3],fi:v[4]});save();render();$("grams").value=100}
$("settingsBtn").onclick=()=>{["gkcal","gp","gc","gf","gfi"].forEach((id,i)=>$(id).value=[state.goals.kcal,state.goals.p,state.goals.c,state.goals.f,state.goals.fi][i]);$("settingsDialog").showModal()}
$("closeSettings").onclick=()=>$("settingsDialog").close()
$("saveSettings").onclick=()=>{state.goals={kcal:+$("gkcal").value||2200,p:+$("gp").value||140,c:+$("gc").value||250,f:+$("gf").value||70,fi:+$("gfi").value||25};save();$("settingsDialog").close();render()}
$("waterBtn").onclick=()=>{state.water[today()]=(state.water[today()]||0)+250;save();alert("已记录 250 ml 饮水\n今天累计："+state.water[today()]+" ml")}
$("weightBtn").onclick=()=>{$("weightInput").value=state.weights[today()]||"";$("weightDialog").showModal()}
$("closeWeight").onclick=()=>$("weightDialog").close()
$("saveWeight").onclick=()=>{const v=parseFloat($("weightInput").value);if(v>0){state.weights[today()]=v;save();$("weightDialog").close();alert("体重已保存："+v+" kg")}}
$("statsBtn").onclick=()=>{ $("statsDialog").showModal();drawChart()}
$("closeStats").onclick=()=>$("statsDialog").close()
$("backupBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="营养Pro备份-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function drawChart(){const c=$("chart"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}const vals=days.map(d=>state.entries.filter(e=>e.date===d).reduce((s,e)=>s+e.kcal,0));const max=Math.max(state.goals.kcal,...vals,1);x.font="22px -apple-system";x.fillStyle="#111827";x.textAlign="center";vals.forEach((v,i)=>{const h=v/max*170,xp=45+i*(W-90)/6;x.fillRect(xp-14,H-45-h,28,h);x.font="12px -apple-system";x.fillText(v?Math.round(v):"—",xp,H-55-h);x.fillText(days[i].slice(5),xp,H-22)});$("avgText").textContent="7天平均热量："+Math.round(vals.reduce((a,b)=>a+b,0)/7)+" kcal/天"}
render();
</script>
</body></html>
