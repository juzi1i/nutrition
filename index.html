<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="营养Pro">
<title>营养Pro 2.0</title>
<style>
:root{--bg:#e9eaec;--card:#f4f5f6;--ink:#17181a;--muted:#74777b;--line:#d7d9dc;--dark:#25272a;--dark2:#3b3e42;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e5e6e8,#f4f4f5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 14px}h1{font-size:31px;margin:0;font-weight:850;letter-spacing:-1px}.date{font-size:12px;color:var(--muted);margin-top:3px}
.iconbtn{width:42px;height:42px;border:1px solid #d1d3d6;border-radius:14px;background:linear-gradient(#fff,#dedfe1);font-size:19px;box-shadow:0 3px 8px #0001}
.card{background:rgba(248,249,250,.92);border:1px solid #fff;border-radius:24px;padding:18px;margin:11px 0;box-shadow:0 10px 30px #0000000d, inset 0 1px #fff}
.hero{display:grid;grid-template-columns:175px 1fr;gap:18px;align-items:center}
.ring{width:158px;height:158px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#202225 var(--deg),#d5d7da 0);position:relative;box-shadow:inset 0 0 0 1px #fff,0 8px 20px #0001}.ring:after{content:"";position:absolute;inset:13px;background:var(--card);border-radius:50%}.ringtxt{position:relative;z-index:1;text-align:center}.ringtxt b{font-size:29px;display:block}.ringtxt span{font-size:11px;color:var(--muted)}
.stats{display:grid;gap:12px}.stat{display:grid;grid-template-columns:58px 1fr 54px;gap:8px;align-items:center;font-size:12px}.bar{height:8px;background:#dfe1e4;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#25272a,#707378);border-radius:99px}.num{text-align:right;font-weight:750}
h2{font-size:18px;margin:0 0 13px}.muted{color:var(--muted)}.small{font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{border:1px solid #111317;border-radius:15px;padding:13px;background:linear-gradient(#383b3f,#202225);color:white;font-size:14px;font-weight:750;box-shadow:0 5px 12px #0002}.btn.secondary{border-color:#d1d3d6;background:linear-gradient(#fff,#dedfe2);color:#1c1e21;box-shadow:0 4px 10px #0001}.btn:active{transform:scale(.98)}
input,select{width:100%;padding:12px;border:1px solid #d2d5d9;border-radius:13px;font-size:16px;background:#fff;outline:none}label{font-size:11px;color:var(--muted);display:block;margin:7px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meal{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #e0e2e5}.meal:last-child{border:0}.tag{font-size:11px;background:#e2e3e5;border:1px solid #d2d4d7;padding:4px 8px;border-radius:99px}.empty{text-align:center;padding:20px;color:#9a9da1}
.chartbox{height:205px;border-radius:17px;background:#f9fafb;border:1px solid #e1e3e5;padding:8px}canvas{width:100%;height:100%}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{flex:1;border:1px solid #d2d4d7;background:#e3e4e6;border-radius:11px;padding:8px;font-size:12px}.tab.on{background:#282a2d;color:#fff;border-color:#282a2d}
dialog{border:0;border-radius:25px;width:min(94vw,560px);padding:0;background:#f4f5f6;box-shadow:0 25px 80px #0006}dialog::backdrop{background:#0007}.modal{padding:20px}.list{max-height:55vh;overflow:auto;margin-top:10px}.fooditem{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #eee;padding:12px 4px;font-size:14px}.cat{font-size:11px;color:#777;margin:12px 2px 5px}.source{margin-top:10px;padding:10px;border-radius:12px;background:#e8e9eb;color:#666;font-size:10px;line-height:1.5}
@media(max-width:520px){.hero{grid-template-columns:140px 1fr}.ring{width:132px;height:132px}.ringtxt b{font-size:24px}.stat{grid-template-columns:52px 1fr 48px}}
</style></head><body><div class="app">
<header><div><h1>营养Pro</h1><div class="date" id="today"></div></div><button class="iconbtn" id="settings">⚙︎</button></header>
<section class="card hero"><div class="ring" id="ring"><div class="ringtxt"><b id="kcal">0</b><span>kcal / 今日</span></div></div><div class="stats">
<div class="stat"><span>蛋白质</span><div class="bar"><div class="fill" id="pb"></div></div><span class="num" id="pn">0g</span></div>
<div class="stat"><span>碳水</span><div class="bar"><div class="fill" id="cb"></div></div><span class="num" id="cn">0g</span></div>
<div class="stat"><span>脂肪</span><div class="bar"><div class="fill" id="fb"></div></div><span class="num" id="fn">0g</span></div>
<div class="small muted" id="remain"></div></div></section>

<section class="card"><h2>添加食物</h2><div class="formgrid"><div><label>餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></div><div><label>重量（g）</label><input id="grams" type="number" value="100" min="1" inputmode="decimal"></div></div>
<label>食物</label><button class="btn secondary" id="pick" style="width:100%;text-align:left">选择食物：燕麦片</button><div class="small muted" id="preview" style="margin:8px 0"></div><button class="btn" id="add" style="width:100%">＋ 添加到今天</button></section>

<section class="card"><h2>今日记录</h2><div id="entries"></div></section>
<section class="card"><h2>近几天变化</h2><div class="tabs"><button class="tab on" data-m="kcal">热量</button><button class="tab" data-m="macro">三大营养素</button><button class="tab" data-m="weight">体重</button></div><div class="chartbox"><canvas id="chart" width="700" height="260"></canvas></div><div class="small muted" id="chartNote" style="margin-top:8px"></div></section>

<section class="card"><h2>快捷功能</h2><div class="grid"><button class="btn secondary" id="water">💧 喝水 250ml</button><button class="btn secondary" id="weight">⚖︎ 记录体重</button><button class="btn secondary" id="backup">↥ 备份数据</button><button class="btn secondary" id="reset">↺ 今日清空</button></div></section>
<div class="source">食物数值为每100g标准参考值；生熟状态、品种、品牌和烹饪方式会造成差异。品牌食品请优先以包装营养标签为准。本库用于日常记录，不替代实验室检测或医疗营养处方。</div>
</div>

<dialog id="foodDlg"><div class="modal"><h2>选择食物</h2><input id="search" placeholder="搜索食物，例如：鸡胸、燕麦、香蕉"><div class="list" id="foodList"></div><button class="btn secondary" id="closeFood" style="width:100%;margin-top:12px">关闭</button></div></dialog>
<dialog id="setDlg"><div class="modal"><h2>每日目标</h2><label>热量 kcal</label><input id="gk"><label>蛋白质 g</label><input id="gp"><label>碳水 g</label><input id="gc"><label>脂肪 g</label><input id="gf"><div class="grid" style="margin-top:14px"><button class="btn" id="saveSet">保存</button><button class="btn secondary" id="closeSet">关闭</button></div></div></dialog>
<dialog id="weiDlg"><div class="modal"><h2>记录体重</h2><label>体重 kg</label><input id="wi" type="number" step=".1" inputmode="decimal"><div class="grid" style="margin-top:14px"><button class="btn" id="saveW">保存</button><button class="btn secondary" id="closeW">关闭</button></div></div></dialog>
